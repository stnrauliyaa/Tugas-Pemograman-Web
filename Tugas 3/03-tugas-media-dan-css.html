<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Encoding UTF-8 wajib supaya teks Bahasa Indonesia tampil benar -->
  <meta charset="UTF-8">
  <!-- Viewport wajib untuk responsif di HP -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemutar Media Kuliah Responsif</title>
  <!-- Hubungkan ke file CSS terpisah -->
  <link rel="stylesheet" href="03-tugas-style.css">
</head>
<body>

     <!--
    BEM Block: "media-card"
    Modifier "media-card--featured" = kelas status tambahan,
    dipakai nanti untuk uji specificity di CSS
  -->
  <main class="media-card media-card--featured">

    <!-- ======================================================
       ART DIRECTION: picture akan diisi source WebP
       di commit-commit berikutnya
       ====================================================== -->
  <figure class="media-card__cover">
    <picture>
         <!-- Layar lebar (desktop, min-width 768px): gambar landscape -->
         <source
            media="(min-width: 768px)"
            srcset="assets/img/cover-desktop.webp"
            type="image/webp">
         <!-- Layar sempit (mobile, max-width 767px): gambar potret/crop -->
         <source
          media="(max-width: 767px)"
          srcset="assets/img/cover-mobile.webp"
          type="image/webp">
        <!-- Fallback wajib: kalau browser tidak dukung WebP/picture -->
        <img
          src="assets/img/cover-fallback.jpg"
          alt="Ilustrasi sampul materi Artificial Intelligence"
          class="media-card__image">
    </picture>
  </figure>

  <header class="media-card__header">
    <h1 class="media-card__title">Pemutar Media Kuliah: Artificial Intelligence</h1>
    <p class="media-card__description">
        Pahami definisi Artificial Intelligence secara mendalam, mulai dari
        sejarah singkat, cara kerja dasarnya, hingga contoh penerapan AI
        dalam kehidupan sehari hari, dilengkapi video penjelasan dan
        narasi audio pendamping.
    </p>
  </header>

  <section class="media-card__body">

    <!-- ======================================================
         VIDEO: poster wajib valid sebagai preview sebelum diputar
         ====================================================== -->
    <div class="media-card__video-wrapper">
      <video
        controls
        poster="assets/video/poster.jpg"
        class="media-card__video">
        Browser Anda tidak mendukung elemen video.
      </video>
    </div>

</section>
  </main>
</body>
</html>
