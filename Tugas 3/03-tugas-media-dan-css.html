<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Encoding UTF-8 wajib supaya teks Bahasa Indonesia tampil benar -->
  <meta charset="UTF-8">
  <!-- Viewport wajib untuk responsif di HP -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemutar Media Kuliah Responsif</title>
  <!-- Hubungkan ke file CSS terpisah -->
  <link rel="stylesheet" href="03-tugas-style.css">
</head>
<body>

     <!--
    BEM Block: "media-card"
    Modifier "media-card--featured" = kelas status tambahan,
    dipakai nanti untuk uji specificity di CSS
  -->
  <main class="media-card media-card--featured">

    <!-- ======================================================
       ART DIRECTION: picture akan diisi source WebP
       di commit-commit berikutnya
       ====================================================== -->
  <figure class="media-card__cover">
    <picture>
         <!-- Layar lebar (desktop, min-width 768px): gambar landscape -->
         <source
            media="(min-width: 768px)"
            srcset="assets/img/cover-desktop.webp"
            type="image/webp">
         <!-- Layar sempit (mobile, max-width 767px): gambar potret/crop -->
         <source
          media="(max-width: 767px)"
          srcset="assets/img/cover-mobile.webp"
          type="image/webp">
    </picture>
  </figure>

  </main>
</body>
</html>
